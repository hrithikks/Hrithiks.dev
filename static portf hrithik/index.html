      "contentType": "project",
      "title": "PartnerFlow \u2014 Business Collaboration Platform",
      "slug": "partnerflow",
      "payload": "{\u0022role\u0022: \u0022Full-Stack Developer\u0022, \u0022tags\u0022: [\u0022SaaS\u0022, \u0022Business Platform\u0022, \u0022Creator Economy\u0022, \u0022Lead Management\u0022, \u0022CRM\u0022, \u0022Analytics\u0022, \u0022Next.js\u0022, \u0022React\u0022, \u0022TypeScript\u0022], \u0022status\u0022: \u0022Completed\u0022, \u0022endDate\u0022: \u0022\u0022, \u0022gallery\u0022: [\u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790788603/DevPortfolio/hnloaiufuxzl2yqpxwpg.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790788604/DevPortfolio/mkjf86yrrxbrclhmhvn0.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790788605/DevPortfolio/vkikikpyo7fdxhs6bpgt.jpg\u0022], \u0022liveUrl\u0022: \u0022https://business.codersvoice.me/\u0022, \u0022problem\u0022: \u0022Managing brand collaborations through scattered emails, social-media messages, pricing documents, media kits, and spreadsheets makes it difficult to maintain a consistent partnership workflow and track leads from enquiry to completion.\u0022, \u0022results\u0022: \u0022Delivered a live business partnership platform capable of handling the complete collaboration funnel, from public brand discovery and enquiry through lead tracking, package management, analytics, and reporting.\u0022, \u0022category\u0022: \u0022Product\u0022, \u0022features\u0022: \u0022Brand collaboration landing page\\nLead capture and management\\nLead status pipeline\\nPackage management\\nMedia kit management\\nPortfolio management\\nCase studies\\nTestimonials\\nFAQ management\\nDynamic website settings\\nDashboard analytics\\nRevenue estimation\\nDeal conversion tracking\\nBudget analysis\\nPackage-interest analytics\\nExcel data export\\nPDF analytical reports\\nConfigurable contact/social sections\\nAdmin-controlled public content\\nResponsive enterprise-style interface\u0022, \u0022solution\u0022: \u0022Built a centralized partner platform where businesses can explore collaboration opportunities, packages, portfolio work, case studies, and creator media information while the internal dashboard manages leads, package offerings, testimonials, case studies, and collaboration analytics.\u0022, \u0022teamSize\u0022: \u00221\u0022, \u0022githubUrl\u0022: \u0022\u0022, \u0022learnings\u0022: \u0022Learned how to design a business-oriented SaaS workflow around CRM-style lead management, configurable content management, analytics, reporting, document generation, and operational dashboards.\u0022, \u0022startDate\u0022: \u00222026-05-01\u0022, \u0022challenges\u0022: \u0022Building a system where public-facing business content and internal operational data could be managed from one centralized platform while maintaining a clear separation between customer-facing experiences and administrative workflows.\u0022, \u0022description\u0022: \u0022PartnerFlow is a generic SaaS platform designed for businesses that manage partnerships, enquiries, service packages, promotional offerings, and client relationships. The platform provides a configurable public-facing business portal combined with an administrative workspace for managing leads, packages, testimonials, case studies, media assets, FAQs, website content, and business analytics.\\n\\nThe system is designed to be adaptable across different businesses rather than being tied to a specific brand or industry. CodersVoice serves as the reference implementation and live demonstration of the platform.\\n\\nThat distinction is much stronger for your portfolio and interviews because you can say:\\n\\n\u201CI didn\u0027t just build the CodersVoice business website. I built a reusable business collaboration platform and implemented CodersVoice as one tenant/use case of that platform.\u201D\u0022, \u0022architecture\u0022: \u0022A full-stack web application with a public business-facing website backed by an authenticated administrative platform. Content and business data are managed dynamically through the admin panel, while reporting and analytics aggregate lead, package, status, and revenue data into actionable dashboards and exportable reports.\u0022, \u0022caseStudyUrl\u0022: \u0022\u0022, \u0022technologies\u0022: [\u0022Next.js\u0022, \u0022React\u0022, \u0022TypeScript\u0022, \u0022PostgreSQL\u0022, \u0022REST APIs\u0022, \u0022Authentication\u0022, \u0022PDF Generation\u0022, \u0022Excel Export\u0022, \u0022Analytics\u0022, \u0022Cloud Deployment\u0022], \u0022thumbnailUrl\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790788662/DevPortfolio/c9jbrabk7f0tk1k2xoqp.png\u0022, \u0022featuredImage\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790788594/DevPortfolio/zhq3q2yqggqrixxmm3j1.jpg\u0022, \u0022shortDescription\u0022: \u0022A configurable business collaboration and lead-management platform that helps organizations manage partnerships, enquiries, packages, content, and business analytics from a centralized system.\u0022}",

      "contentType": "project",
      "title": "SNOQ",
      "slug": "snoq",
      "payload": "{\u0022role\u0022: \u0022Full-Stack Developer\u0022, \u0022tags\u0022: [\u0022AI\u0022, \u0022SaaS\u0022, \u0022Knowledge Management\u0022, \u0022Productivity\u0022, \u0022Resource Management\u0022, \u0022Full Stack\u0022, \u0022Next.js\u0022, \u0022TypeScript\u0022, \u0022PostgreSQL\u0022], \u0022status\u0022: \u0022Completed\u0022, \u0022endDate\u0022: \u0022\u0022, \u0022gallery\u0022: [\u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787010/DevPortfolio/wxofu7ty9r4tmpmoivb3.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787011/DevPortfolio/dvgnzrvjfhzs5myrj1xk.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787012/DevPortfolio/zv5fbgkmv5cokbhdtjt6.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787013/DevPortfolio/assnhmmzqmbgrpsdbdc8.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787020/DevPortfolio/kukpbfcwtt1utostoqa0.jpg\u0022], \u0022liveUrl\u0022: \u0022https://snoq.codersvoice.me/\u0022, \u0022problem\u0022: \u0022People constantly discover useful links, documents, tutorials, repositories, courses, templates, career resources, and other information but often lose them across browser bookmarks, messaging apps, notes, cloud storage, and multiple platforms. Traditional bookmark managers primarily store URLs without providing meaningful organization, contextual discovery, or intelligent assistance. SNOQ addresses the problem by providing a centralized personal knowledge vault where users can collect different types of resources, organize them into categories and lists, mark important items, archive outdated resources, and use AI-assisted capabilities to manage their knowledge more effectively.\u0022, \u0022results\u0022: \u0022Built and deployed a complete AI-powered knowledge management SaaS with personal resource management, AI-assisted organization, subscription plans, AI credit tracking, payment integration, administrative controls, reporting, exports, and personalized user settings. The platform provides an end-to-end SaaS workflow from resource capture and organization to AI assistance, subscription management, reporting, and administration.\u0022, \u0022category\u0022: \u0022SAAS\u0022, \u0022features\u0022: \u0022\u2022 Personal resource vault\\n\u2022 AI-assisted resource organization\\n\u2022 Link and resource management\\n\u2022 Document management\\n\u2022 Lists and collections\\n\u2022 Categories and knowledge mapping\\n\u2022 Favorites\\n\u2022 Archived resources\\n\u2022 Resource search and discovery\\n\u2022 Recently added resources\\n\u2022 Resource metadata and categorization\\n\u2022 Personal dashboard\\n\u2022 AI assistance / AI credits\\n\u2022 Subscription plans\\n\u2022 Free and paid plans\\n\u2022 Razorpay payment integration\\n\u2022 Coupon and discount management\\n\u2022 Usage limits and plan-based AI credits\\n\u2022 PDF reports\\n\u2022 Excel reports\\n\u2022 Private data reports\\n\u2022 Email report delivery\\n\u2022 User profile management\\n\u2022 Password and security management\\n\u2022 Admin dashboard\\n\u2022 User management\\n\u2022 User role management\\n\u2022 Plan management\\n\u2022 Coupon management\\n\u2022 Announcements\\n\u2022 Secure administrative reports\\n\u2022 Plan visibility and activation controls\\n\u2022 Responsive enterprise-style UI\u0022, \u0022solution\u0022: \u0022SNOQ provides a centralized digital vault for managing personal knowledge and resources. Users can add and organize links, documents, lists, references, repositories, courses, templates, and other resources. The platform provides categorized libraries, favorites, archives, dashboards, AI-assisted organization, search and discovery capabilities, personalized settings, and private data reports. A subscription and AI-credit system supports different usage levels, while administrative controls allow management of users, plans, coupons, announcements, and reports.\u0022, \u0022teamSize\u0022: \u00221\u0022, \u0022githubUrl\u0022: \u0022#\u0022, \u0022learnings\u0022: \u0022Designed and implemented a complete SaaS product lifecycle covering frontend architecture, backend APIs, relational database design, authentication, authorization, AI integration, usage-based AI credits, subscription and payment workflows, coupon management, reporting, file generation, administrative systems, and production deployment. The project provided practical experience in designing product features around real user workflows rather than building isolated technical components.\u0022, \u0022startDate\u0022: \u00222026-08-30\u0022, \u0022challenges\u0022: \u0022Designing a complete knowledge-management SaaS required solving several problems beyond basic CRUD operations. The application needed to support different resource types while maintaining a consistent data model, provide meaningful categorization and discovery, integrate AI assistance without making AI mandatory for basic functionality, implement usage-based AI credits, support free and paid subscription plans, manage coupons and plan restrictions, generate private PDF and Excel reports, provide secure administrative controls, and maintain a clean user experience as the number of resources grows.\u0022, \u0022description\u0022: \u0022SNOQ is an AI-powered personal knowledge and resource management platform designed to help users capture, organize, discover, and revisit valuable digital information from across the web. Users can store links, documents, lists, references, courses, repositories, career resources, templates, and other knowledge assets in a centralized personal vault. AI-assisted organization helps users structure their resources and retrieve useful information faster, while dashboards, categories, favorites, archives, reports, and personalized settings provide a complete knowledge-management experience.\u0022, \u0022architecture\u0022: \u0022SNOQ follows a modern full-stack SaaS architecture with a responsive web frontend, backend API layer, relational PostgreSQL data storage, authentication and authorization, AI integration, subscription management, reporting services, and administrative modules. The application separates user-facing knowledge management from platform administration and supports modular services for AI assistance, resource management, billing, reporting, and user management. The architecture is designed to support multi-plan SaaS usage with configurable AI credits, feature access, private reports, coupons, and subscription controls.\u0022, \u0022caseStudyUrl\u0022: \u0022\u0022, \u0022technologies\u0022: [\u0022Next.js\u0022, \u0022TypeScript\u0022, \u0022React\u0022, \u0022PostgreSQL\u0022, \u0022AI Integration\u0022, \u0022REST APIs\u0022, \u0022Razorpay\u0022, \u0022PDF Generation\u0022, \u0022Excel Export\u0022, \u0022Authentication\u0022, \u0022SaaS Architecture\u0022], \u0022thumbnailUrl\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790786934/DevPortfolio/fle5vlq7wf1hyqybgd4v.png\u0022, \u0022featuredImage\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790786992/DevPortfolio/wg6odguy6hgol9nschoo.jpg\u0022, \u0022shortDescription\u0022: \u0022An AI-powered personal knowledge system for saving, organizing, discovering, and managing digital resources.\u0022}",

      "title": "codersvoice-store",
      "slug": "codersvoice-store",
      "payload": "{\u0022role\u0022: \u0022Full-Stack Developer\u0022, \u0022tags\u0022: [\u0022Digital store\u0022, \u0022E commerce Live app\u0022, \u0022Dynamic product management\u0022], \u0022status\u0022: \u0022Completed\u0022, \u0022endDate\u0022: \u00222026-09-16\u0022, \u0022gallery\u0022: [\u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790785325/DevPortfolio/sgaynnwm5t6nyhgnoqng.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790785326/DevPortfolio/cxgnapbyxptzsgp6mpx7.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790785326/DevPortfolio/qbzt37jbojbzifssp5na.jpg\u0022], \u0022liveUrl\u0022: \u0022https://store.codersvoice.me/\u0022, \u0022problem\u0022: \u0022Digital products such as AI prompts, creator bundles, eBooks, PDFs and software resources require a dedicated platform where products can be presented professionally and customers can discover and purchase them without relying on a generic marketplace.\u0022, \u0022results\u0022: \u0022Built and deployed a functional digital-products marketplace under the CodersVoice ecosystem, providing a dedicated platform for publishing and commercially distributing digital products.\u0022, \u0022category\u0022: \u0022Product\u0022, \u0022features\u0022: \u0022\u2022 Digital product catalog and product discovery\\n\u2022 Product detail pages\\n\u2022 Digital product categorization\\n\u2022 Product administration and management\\n\u2022 Razorpay payment integration\\n\u2022 MongoDB-backed product data\\n\u2022 REST API-based frontend/backend communication\\n\u2022 Responsive user interface\\n\u2022 Custom-domain deployment\\n\u2022 Digital-product focused purchasing workflow\u0022, \u0022solution\u0022: \u0022Built a dedicated CodersVoice digital-products marketplace with a product-focused frontend, backend APIs, database-driven product management and payment integration. The platform provides a centralized commercial experience for publishing and selling different types of downloadable digital products under the CodersVoice brand.\u0022, \u0022teamSize\u0022: \u0022\u0022, \u0022githubUrl\u0022: \u0022#\u0022, \u0022learnings\u0022: \u0022Gained practical experience designing and deploying a complete full-stack commercial application, integrating payment APIs, structuring database-driven product workflows, connecting frontend and backend services, and operating a production web application.\u0022, \u0022startDate\u0022: \u00222026-07-30\u0022, \u0022challenges\u0022: \u0022Designing a reusable marketplace structure that could support different types of digital products while keeping the purchasing experience simple and maintaining reliable communication between the React frontend, Express backend, database and payment gateway.\u0022, \u0022description\u0022: \u0022CodersVoice Store is a production-ready digital products marketplace built as part of the CodersVoice ecosystem. The platform enables customers to discover and purchase digital products such as AI prompt bundles, creator resources, eBooks, PDFs, developer resources, and software/source-code products. The application includes product discovery, product details, digital-product presentation, purchasing workflows, and an administration-driven product management experience. It was designed with a focus on a clean commercial user experience, responsive design, custom-domain deployment, and practical digital-product delivery.\u0022, \u0022architecture\u0022: \u0022Client-server architecture with a React-based frontend communicating with a Node.js/Express backend through REST APIs. Product and application data are persisted in MongoDB Atlas, while Razorpay is integrated for payment processing. The application is deployed using a custom CodersVoice domain with separate application/backend responsibilities.\u0022, \u0022caseStudyUrl\u0022: \u0022\u0022, \u0022technologies\u0022: [\u0022React\u0022, \u0022TypeScript\u0022, \u0022Node.js\u0022, \u0022Express.js\u0022, \u002     {
      "contentType": "project",
      "title": "Hrithik-portfolio-cms",
      "slug": "hrithik-portfolio-cms",
      "payload": "{\u0022role\u0022: \u0022Full-Stack Developer\u0022, \u0022tags\u0022: [\u0022React\u0022, \u0022.NET\u0022, \u0022ASP.NET Core\u0022, \u0022C#\u0022, \u0022REST API\u0022, \u0022SQL Server\u0022, \u0022JavaScript\u0022, \u0022TypeScript\u0022, \u0022HTML\u0022, \u0022CSS\u0022, \u0022REST APIs\u0022], \u0022status\u0022: \u0022\u0022, \u0022endDate\u0022: \u0022\u0022, \u0022gallery\u0022: [], \u0022liveUrl\u0022: \u0022#\u0022, \u0022problem\u0022: \u0022Developers often maintain portfolio information across static websites, code files and different online profiles. Updating projects, experience, skills, publications and other professional information manually can become repetitive and requires direct changes to the website source code.\\n\\nThe goal was to create a centralized portfolio management system where professional information could be maintained through an administrative interface and reused to generate a complete portfolio without repeatedly editing the frontend code.\u0022, \u0022results\u0022: \u0022Built a centralized portfolio management platform that replaces hardcoded portfolio maintenance with database-driven content management. The system provides a structured way to manage a complete professional profile and generate a portfolio from the same underlying information, while also supporting resume-oriented content generation.\u0022, \u0022category\u0022: \u0022Product\u0022, \u0022features\u0022: \u0022\u2022 Admin dashboard for portfolio management\\n\u2022 Dynamic About section management\\n\u2022 Education and experience management\\n\u2022 Project management with detailed case-study fields\\n\u2022 Research and publication management\\n\u2022 Skills and achievements management\\n\u2022 Testimonials and services management\\n\u2022 Hero and navigation configuration\\n\u2022 Website section management\\n\u2022 SEO configuration\\n\u2022 Site-wide settings\\n\u2022 Project image and gallery management\\n\u2022 GitHub and live-demo links\\n\u2022 Dynamic portfolio content rendering\\n\u2022 Static portfolio generation\\n\u2022 Resume/LaTeX content generation workflow\\n\u2022 Centralized content management through the admin panel\u0022, \u0022solution\u0022: \u0022Built a database-driven portfolio CMS with an administrative dashboard for managing structured professional content. The system separates portfolio data from presentation, allowing sections such as About, Education, Experience, Projects, Research, Publications, Skills, Achievements, Testimonials, Services, Hero content, Navigation, SEO and site settings to be managed independently.\\n\\nThe configured data can then be consumed by the portfolio application to produce a professional website. The platform also includes functionality for generating a static portfolio and preparing structured resume/LaTeX content from the configured professional information.\u0022, \u0022teamSize\u0022: \u00221\u0022, \u0022githubUrl\u0022: \u0022https://github.com/hrithikksingh3/DevFolioGen-with-CMS.git\u0022, \u0022learnings\u0022: \u0022Gained practical experience designing a full-stack CMS, structuring relational content models, building REST APIs with .NET, integrating React with a backend API, designing admin workflows, separating content from presentation, and implementing generation workflows for reusable portfolio content.\u0022, \u0022startDate\u0022: \u0022\u0022, \u0022challenges\u0022: \u0022Designing a flexible content model that could represent many different portfolio sections while keeping the administration experience simple. Another challenge was separating content from presentation so that changes made through the CMS could automatically flow into the portfolio without requiring manual frontend modifications.\\n\\nThe project also required handling relationships between portfolio entities, media, project information, SEO configuration and generated output while keeping the system extensible for future portfolio features.\u0022, \u0022description\u0022: \u0022Hrithik Portfolio CMS is a full-stack, database-driven portfolio management system designed to manage and generate a professional developer portfolio through an administrative interface. Instead of hardcoding portfolio content, the system allows structured information such as experience, projects, education, skills, research, publications, services, testimonials, SEO and website configuration to be managed centrally.\u0022, \u0022architecture\u0022: \u0022The application follows a full-stack client-server architecture with a React frontend communicating with a .NET backend through REST APIs. The backend handles business logic, validation and content-management operations while persistent portfolio data is stored in a relational database.\\n\\nThe CMS separates administrative content management from the public portfolio presentation layer, allowing portfolio sections to be dynamically populated from stored configuration rather than hardcoded content. A generation workflow can transform the configured content into a deployable/static portfolio representation.\u0022, \u0022caseStudyUrl\u0022: \u0022\u0022, \u0022technologies\u0022: [\u0022React\u0022, \u0022.NET\u0022, \u0022ASP.NET Core\u0022, \u0022C#\u0022, \u0022REST API\u0022, \u0022SQL Server\u0022, \u0022JavaScript\u0022, \u0022TypeScript\u0022, \u0022HTML\u0022, \u0022CSS\u0022, \u0022REST APIs\u0022], \u0022thumbnailUrl\u0022: \u0022\u0022, \u0022featuredImage\u0022: \u0022\u0022, \u0022shortDescription\u0022: \u0022A full-stack portfolio management system that lets developers configure their professional portfolio through an admin panel and generate a production-ready portfolio from structured content.\u0022}",

      "contentType": "project",
      "title": "RadioRasta",
      "slug": "radiorasta",
      "payload": "{\u0022role\u0022: \u0022\u0022, \u0022tags\u0022: [\u0022Music\u0022, \u0022Radio\u0022, \u0022Nostalgia\u0022, \u0022Entertainment\u0022, \u0022Next.js\u0022, \u0022Full Stack\u0022, \u0022PWA\u0022, \u0022Interactive Experience\u0022], \u0022status\u0022: \u0022Completed\u0022, \u0022endDate\u0022: \u00222026-08-01\u0022, \u0022gallery\u0022: [\u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787948/DevPortfolio/sda9j71lc1jqaw3fydui.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787949/DevPortfolio/ciunruhtqdqo5pxamuji.jpg\u0022, \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787950/DevPortfolio/uh2383di9ozsj5d1dxmo.jpg\u0022], \u0022liveUrl\u0022: \u0022https://radiorasta.codersvoice.me/\u0022, \u0022problem\u0022: \u0022Modern music platforms are primarily designed around songs, playlists, artists, and recommendations. They often do not recreate the emotional context and nostalgia associated with listening to music during everyday experiences such as travelling by bus or train, sitting at a chai tapri, spending time at a dhaba, or listening to music during a rainy evening.\u0022, \u0022results\u0022: \u0022Built and deployed a live interactive radio experience containing multiple themed nostalgic environments, responsive interfaces, curated radio sources, custom visual assets, and an installable web-app experience for desktop and mobile users.\u0022, \u0022category\u0022: \u0022Product\u0022, \u0022features\u0022: \u0022\u2022 Interactive nostalgic radio experience\\n\u2022 90s Indian nostalgia-inspired environments\\n\u2022 Multiple themed radio worlds\\n\u2022 Bus Wala\\n\u2022 Truck Driver\\n\u2022 Chai Tapri\\n\u2022 Deluxe Saloon\\n\u2022 Train Radio\\n\u2022 Dhaba Radio\\n\u2022 Baarish Wali Khidki\\n\u2022 2AM Rooftop\\n\u2022 Mohalle Wala Pyaar\\n\u2022 Curated radio/music experiences\\n\u2022 Immersive world-specific UI\\n\u2022 Animated visual experiences\\n\u2022 Anonymous-first exploration\\n\u2022 Optional tickets/preferences persisted locally\\n\u2022 Responsive desktop/mobile experience\\n\u2022 Installable web app / PWA experience\\n\u2022 Cloudinary-powered visual assets\\n\u2022 YouTube-based radio sources\u0022, \u0022solution\u0022: \u0022RadioRasta transforms music discovery into an immersive nostalgic experience. Users can enter different themed Indian environments and experience music through the atmosphere associated with that setting. The experience combines curated radio content, visual environments, animation, and themed interactions to create a more memorable way of discovering and listening to music.\u0022, \u0022teamSize\u0022: \u00221\u0022, \u0022githubUrl\u0022: \u0022\u0022, \u0022learnings\u0022: \u0022The project provided practical experience in designing experience-driven products, building interactive interfaces with Next.js, managing media assets through Cloudinary, integrating external media sources, designing responsive and installable web applications, and creating a product around emotional storytelling rather than conventional CRUD workflows.\u0022, \u0022startDate\u0022: \u00222026-07-01\u0022, \u0022challenges\u0022: \u0022The main challenge was creating a music product that feels like an experience rather than another conventional streaming interface. The project required combining themed visual environments, animations, radio content, responsive layouts, persistent user preferences, and a consistent nostalgic design language while keeping the interaction lightweight and accessible.\\n\u0022, \u0022description\u0022: \u0022RadioRasta is a nostalgic Indian music and radio experience built around immersive everyday memories from 90s and early-2000s India. Instead of presenting music as a conventional playlist interface, the platform lets users explore themed experiences inspired by familiar Indian settings such as bus journeys, chai tapris, train rides, dhabas, rainy windows, late-night rooftops, salons, and neighborhood moments. Each world creates a distinct atmosphere around curated radio and music experiences while keeping exploration simple and anonymous-first.\u0022, \u0022architecture\u0022: \u0022RadioRasta is built as a modern Next.js web application with PostgreSQL persistence through Neon and Drizzle ORM, Cloudinary-hosted visual assets, and curated YouTube radio sources. The application is designed for responsive desktop and mobile experiences and can be installed as a web app. Its world-based architecture allows individual experiences to have their own visual identity, assets, content, and radio configuration.\u0022, \u0022caseStudyUrl\u0022: \u0022\u0022, \u0022technologies\u0022: [\u0022Next.js\u0022, \u0022TypeScript\u0022, \u0022React\u0022, \u0022Neon PostgreSQL\u0022, \u0022Drizzle ORM\u0022, \u0022Cloudinary\u0022, \u0022YouTube\u0022, \u0022Vercel\u0022], \u0022thumbnailUrl\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787918/DevPortfolio/gmocnwtzjjg47qfz75qi.png\u0022, \u0022featuredImage\u0022: \u0022https://res.cloudinary.com/duuw8pdvy/image/upload/v1790787933/DevPortfolio/zwczylxkzfnmg4xn4vrp.jpg\u0022, \u0022shortDescription\u0022: \u0022A nostalgic Indian radio experience that turns everyday memories into interactive listening worlds.\u0022}",
